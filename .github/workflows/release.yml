name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        shell: pwsh
        run: cargo build --release

      - name: Package as .asi
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/RivalsSigBypass.dll dist/RivalsSigBypass.asi

      # Publishes only on a version tag (v*); a manual run just verifies the build.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RivalsSigBypass.asi
          fail_on_unmatched_files: true
